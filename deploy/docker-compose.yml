services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: task_control
      POSTGRES_USER: task_control
      POSTGRES_PASSWORD: task_control
    ports:
      - "5432:5432"
    volumes:
      - task_control_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_control -d task_control"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      TASK_CONTROL_DATABASE_URL: postgresql+psycopg://task_control:task_control@db:5432/task_control
      TASK_CONTROL_SECRET_KEYS: '{"1":"REPLACE_WITH_32_BYTE_BASE64"}'
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      TASK_CONTROL_DATABASE_URL: postgresql+psycopg://task_control:task_control@db:5432/task_control
      TASK_CONTROL_SECRET_KEYS: '{"1":"REPLACE_WITH_32_BYTE_BASE64"}'
      TASK_CONTROL_SCRIPT_ROOT: /opt/task-scripts
      TASK_CONTROL_COOKIE_SECURE: "false"
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    volumes:
      - ./task-scripts:/opt/task-scripts:ro

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      TASK_CONTROL_DATABASE_URL: postgresql+psycopg://task_control:task_control@db:5432/task_control
      TASK_CONTROL_SECRET_KEYS: '{"1":"REPLACE_WITH_32_BYTE_BASE64"}'
      TASK_CONTROL_SCRIPT_ROOT: /opt/task-scripts
    command: ["python", "-m", "task_control.worker.loop"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./task-scripts:/opt/task-scripts:ro

  scheduler:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      TASK_CONTROL_DATABASE_URL: postgresql+psycopg://task_control:task_control@db:5432/task_control
      TASK_CONTROL_SECRET_KEYS: '{"1":"REPLACE_WITH_32_BYTE_BASE64"}'
    command: ["python", "-m", "task_control.scheduler.loop"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  task_control_pg:
