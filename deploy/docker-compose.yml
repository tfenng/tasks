name: task-control

x-app: &app
  image: task-control:local
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  env_file:
    - path: .env
      required: false
  environment: &app-environment
    TASK_CONTROL_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-task_control}:${POSTGRES_PASSWORD:-task_control}@db:5432/${POSTGRES_DB:-task_control}
    TASK_CONTROL_SECRET_KEYS: ${TASK_CONTROL_SECRET_KEYS:?set TASK_CONTROL_SECRET_KEYS in deploy/.env}
    TASK_CONTROL_SECRET_ACTIVE_VERSION: ${TASK_CONTROL_SECRET_ACTIVE_VERSION:-1}
    TASK_CONTROL_SCRIPT_ROOT: /opt/task-scripts
    TASK_CONTROL_OUTPUT_ROOT: /var/lib/task-control-output
    TASK_CONTROL_COOKIE_SECURE: ${TASK_CONTROL_COOKIE_SECURE:-false}
    TASK_CONTROL_LOG_LEVEL: ${TASK_CONTROL_LOG_LEVEL:-INFO}
  init: true
  restart: unless-stopped

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-task_control}
      POSTGRES_USER: ${POSTGRES_USER:-task_control}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-task_control}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - task_control_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    command: ["uvicorn", "task_control.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${TASK_CONTROL_API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./task-scripts:/opt/task-scripts:ro
      - task_control_output:/var/lib/task-control-output
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  worker:
    <<: *app
    command: ["python", "-m", "task_control.worker.loop"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./task-scripts:/opt/task-scripts:ro
      - task_control_output:/var/lib/task-control-output

  scheduler:
    <<: *app
    command: ["python", "-m", "task_control.scheduler.loop"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  task_control_pg:
  task_control_output:
