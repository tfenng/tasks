name: task-control-ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: task_control_test
          POSTGRES_USER: task_control
          POSTGRES_PASSWORD: task_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U task_control -d task_control_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - run: uv sync --frozen --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
        env:
          TASK_CONTROL_DATABASE_URL: postgresql+psycopg://task_control:task_control@localhost:5432/task_control_test
          TASK_CONTROL_SCRIPT_ROOT: /tmp/task-control-scripts
          TASK_CONTROL_SECRET_KEYS: '{"1":"ZGV2LW9ubHktMzItYnl0ZS1rZXktZm9yLXRlc3RzISE="}'

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
